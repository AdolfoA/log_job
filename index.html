<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bitácora Adolfo</title>
<style>
:root{--bg:#0b0f14;--panel:#111821;--panel2:#0e141b;--line:#1f2b38;--text:#e6edf3;--mute:#8b9bb0;--acc:#10b981;--acc2:#0f766e;--warn:#f59e0b;--bad:#ef4444;--info:#38bdf8}
@media (prefers-color-scheme:light){:root:not([data-theme=dark]){--bg:#f5f7fa;--panel:#fff;--panel2:#f0f3f7;--line:#d8e0ea;--text:#18212b;--mute:#5b6b7e;--acc:#0b8f66;--acc2:#0b8f66}}
:root[data-theme=light]{--bg:#f5f7fa;--panel:#fff;--panel2:#f0f3f7;--line:#d8e0ea;--text:#18212b;--mute:#5b6b7e;--acc:#0b8f66;--acc2:#0b8f66}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.wrap{max-width:880px;margin:0 auto;padding:20px 16px 60px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
h1{font-size:22px;margin:0}
h1 small{font:12px ui-monospace,Consolas,monospace;color:var(--acc);margin-left:8px}
.bar{display:flex;gap:8px;flex-wrap:wrap}
button,select,input,textarea{font:inherit;color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 12px}
button{cursor:pointer}button:hover{border-color:var(--acc)}
button.pri{background:var(--acc2);border-color:var(--acc2);color:#fff}
.stats{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font:12px ui-monospace,Consolas,monospace;color:var(--mute)}
.stat b{color:var(--text)}
.filters{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:14px;display:grid;gap:10px}
.filters .row{display:flex;gap:8px;flex-wrap:wrap}
.filters input[type=search]{flex:1;min-width:180px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:4px 12px;border-radius:999px;border:1px solid var(--line);background:var(--panel2);font-size:13px;cursor:pointer;color:var(--mute)}
.chip.on{background:var(--acc2);border-color:var(--acc2);color:#fff}
.entry{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px}
.entry.open-state{border-left:3px solid var(--warn)}
.entry.resolved-state{border-left:3px solid var(--acc)}
.e-Abierto{color:var(--warn);border-color:var(--warn)}
.e-Resuelto{color:var(--acc);border-color:var(--acc);font-weight:600}
.meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font:12px ui-monospace,Consolas,monospace;color:var(--mute);margin-bottom:6px}
.badge{border:1px solid var(--line);border-radius:6px;padding:1px 8px}
.t-Cambio{color:var(--acc)}.t-Consulta{color:var(--info)}.t-Pendiente{color:var(--warn)}.t-Hallazgo{color:var(--bad)}.t-Decisión{color:#a78bfa}
.entry h3{margin:0 0 6px;font-size:16px}
.entry p{margin:0;color:var(--text);white-space:pre-wrap}
details{margin-top:8px}summary{cursor:pointer;color:var(--mute);font-size:13px}
pre{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px;overflow:auto;font:12.5px/1.5 ui-monospace,Consolas,monospace;margin:8px 0 0}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.tag{font:11px ui-monospace,Consolas,monospace;color:var(--mute)}
.actions{display:flex;gap:6px;margin-top:10px}
.actions button{padding:3px 10px;font-size:12px}
.grupo{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--acc);margin:22px 0 8px;font-family:ui-monospace,Consolas,monospace}
[hidden]{display:none!important}
.tabs{display:flex;gap:6px;margin-bottom:14px;border-bottom:1px solid var(--line)}
.tab{background:none;border:none;border-bottom:2px solid transparent;border-radius:0;padding:8px 14px;color:var(--mute);cursor:pointer}
.tab.on{color:var(--text);border-bottom-color:var(--acc)}
.code-wrap{display:grid;grid-template-columns:230px 1fr;gap:12px;margin-top:12px}
@media (max-width:760px){.code-wrap{grid-template-columns:1fr}}
.filelist{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px;align-self:start;max-height:70vh;overflow:auto}
.fbtn{display:block;width:100%;text-align:left;background:none;border:none;border-radius:6px;padding:5px 8px;font:12.5px ui-monospace,Consolas,monospace;color:var(--mute);cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fbtn:hover{background:var(--panel2);color:var(--text)}
.fbtn.on{background:var(--acc2);color:#fff}
.viewer{background:var(--panel);border:1px solid var(--line);border-radius:12px;min-width:0}
.vbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:10px;border-bottom:1px solid var(--line)}
.vbar .path{font:13px ui-monospace,Consolas,monospace;flex:1 1 100%;word-break:break-all}
.vbar select{max-width:100%;flex:1 1 220px;font-size:13px}
.vbar button,.vbar a{font-size:12px;padding:5px 10px;border:1px solid var(--line);border-radius:8px;color:var(--text);text-decoration:none;background:var(--panel)}
.vinfo{font:12px ui-monospace,Consolas,monospace;color:var(--mute);padding:6px 10px}
.code{overflow:auto;max-height:70vh;font:12.5px/1.55 ui-monospace,Consolas,monospace;padding:6px 0}
.cl{display:flex;white-space:pre;min-width:max-content}
.cl .ln{flex:0 0 52px;text-align:right;padding-right:10px;color:var(--mute);user-select:none}
.cl .tx{padding-right:14px}
.cl.add{background:#10b98122}.cl.add .tx::before{content:'+ ';color:var(--acc)}
.cl.del{background:#ef444422}.cl.del .tx::before{content:'- ';color:var(--bad)}
.cl.ctx .tx::before{content:'  '}
.vmsg{padding:24px;text-align:center;color:var(--mute)}
.chk{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mute)}
.chk input{padding:0}
.sep{width:1px;background:var(--line);margin:2px 4px}
.empty{text-align:center;color:var(--mute);padding:40px 0}
dialog{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:14px;width:min(560px,94vw);padding:18px}
dialog::backdrop{background:#0009}
dialog form{display:grid;gap:10px}
dialog label{display:grid;gap:4px;font-size:13px;color:var(--mute)}
dialog textarea{min-height:90px;resize:vertical}
.note{font-size:12px;color:var(--mute);margin-top:18px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Bitácora Adolfo<small>log de chats</small></h1>
    <div class="bar">
      <button class="pri" id="nuevo">+ Nueva entrada</button>
      <button id="exportar">Exportar JSON</button>
      <button id="importar">Importar</button>
      <button id="tema" title="Cambiar tema">◐</button>
      <input type="file" id="archivo" accept=".json" hidden>
    </div>
  </header>

  <div class="tabs">
    <button class="tab on" id="tabLog">Bitácora</button>
    <button class="tab" id="tabCodigo">Código</button>
  </div>

  <div id="vistaLog">
  <div class="stats" id="stats"></div>

  <div class="filters">
    <div class="row">
      <input type="search" id="buscar" placeholder="Buscar en título, resumen, código o tags…">
      <select id="orden"><option value="cat">Por categoría</option><option value="desc">Más recientes</option><option value="asc">Más antiguas</option></select>
    </div>
    <div class="chips" id="cats"></div>
    <div class="chips" id="chats"></div>
    <div class="chips" id="tipos"></div>
  </div>

  <div id="lista"></div>
  <p class="note" id="nota"></p>
  </div>

  <div id="vistaCodigo" hidden>
    <div class="chips" id="proyectos"></div>
    <div class="code-wrap">
      <div class="filelist" id="archivos"></div>
      <div class="viewer">
        <div class="vbar" id="vbar" hidden>
          <div class="path" id="vpath"></div>
          <select id="vversion" aria-label="Versión"></select>
          <label class="chk"><input type="checkbox" id="vdiff"> Ver cambios</label>
          <button id="vcopiar">Copiar</button>
          <a id="vgh" target="_blank" rel="noopener">Ver en GitHub</a>
          <a id="vhist" target="_blank" rel="noopener">Historial</a>
        </div>
        <div class="vinfo" id="vinfo" hidden></div>
        <div class="code" id="vcode"><div class="vmsg">Elige un proyecto y un archivo.</div></div>
      </div>
    </div>
    <p class="note">Lee la carpeta <code>proyectos/</code> del repo usando la API pública de GitHub (límite de 60 consultas por hora por IP; se guarda en caché 5 minutos).</p>
  </div>
</div>

<dialog id="dlg">
  <form method="dialog" id="form">
    <h2 style="margin:0" id="dlgTitulo">Nueva entrada</h2>
    <label>Categoría<input name="categoria" list="catsList" placeholder="Modelo de costos" required></label>
    <datalist id="catsList"></datalist>
    <label>Chat<input name="chat" list="chatsList" placeholder="Adolfo [Modelo costo agua]" required></label>
    <datalist id="chatsList"></datalist>
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px">
      <label>Fecha<input type="date" name="fecha" required></label>
      <label>Tipo<select name="tipo"><option>Cambio</option><option>Consulta</option><option>Pendiente</option><option>Hallazgo</option><option>Decisión</option></select></label>
      <label>Estado<select name="estado"><option>Hecho</option><option>Abierto</option><option>Resuelto</option></select></label>
    </div>
    <label>Título<input name="titulo" required></label>
    <label>Resumen<textarea name="resumen" required></textarea></label>
    <label>Detalle / código (opcional)<textarea name="detalle"></textarea></label>
    <label>Tags (separados por coma)<input name="tags"></label>
    <div class="bar" style="justify-content:flex-end">
      <button type="button" id="cancelar">Cancelar</button>
      <button class="pri" type="submit">Guardar</button>
    </div>
  </form>
</dialog>

<script>
const LS = 'adolfo-log-local-v1';
let base = [];            // entradas del repo (data/entries.json)
let locales = [];         // entradas creadas/editadas en este navegador
let filtro = {chat:'', tipo:'', categoria:'', estado:'', q:'', orden:'cat'};
let editando = null;

const $ = id => document.getElementById(id);
const el = (tag, cls, txt) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; };

function leerLocal(){ try { return JSON.parse(localStorage.getItem(LS)) || []; } catch { return []; } }
function guardarLocal(){ try { localStorage.setItem(LS, JSON.stringify(locales)); } catch {} }

function todas(){
  const m = new Map();
  base.forEach(e => m.set(e.id, e));
  locales.forEach(e => m.set(e.id, e));
  return [...m.values()].filter(e => !e._borrada);
}

async function cargar(){
  locales = leerLocal();
  try {
    const r = await fetch('data/entries.json', {cache:'no-store'});
    if (!r.ok) throw 0;
    base = await r.json();
    $('nota').textContent = 'Entradas del repo: ' + base.length + ' · Locales (este navegador): ' + locales.length + '. Para que otros dispositivos las vean, exporta el JSON y reemplaza data/entries.json en el repo.';
  } catch {
    base = [];
    $('nota').textContent = 'No se pudo leer data/entries.json (¿abriste el archivo directo desde el disco?). Sirve la carpeta con "python -m http.server" o despliega en GitHub Pages.';
  }
  render();
}

function chips(cont, valores, clave){
  cont.replaceChildren();
  const mk = (v, t) => { const c = el('span','chip'+(filtro[clave]===v?' on':''), t); c.onclick = () => { filtro[clave] = v; render(); }; cont.append(c); };
  mk('', 'Todos');
  valores.forEach(v => mk(v, v));
}

function render(){
  const data = todas();
  const chatsU = [...new Set(data.map(e => e.chat))].sort();
  const tiposU = [...new Set(data.map(e => e.tipo))].sort();
  const catsU = [...new Set(data.map(e => e.categoria || 'Sin categoría'))].sort();
  chips($('cats'), catsU, 'categoria');
  chips($('chats'), chatsU, 'chat');
  $('catsList').replaceChildren(...catsU.map(c => { const o = el('option'); o.value = c; return o; }));
  const tc = $('tipos'); tc.replaceChildren();
  const mk = (t, on, fn) => { const ch = el('span','chip' + (on ? ' on' : ''), t); ch.onclick = fn; tc.append(ch); };
  mk('Todos', !filtro.tipo && !filtro.estado, () => { filtro.tipo = ''; filtro.estado = ''; render(); });
  tiposU.forEach(v => mk(v, filtro.tipo === v, () => { filtro.tipo = filtro.tipo === v ? '' : v; render(); }));
  tc.append(el('span','sep'));
  ['Abierto','Resuelto','Hecho'].filter(x => data.some(e => e.estado === x)).forEach(v => mk(v, filtro.estado === v, () => { filtro.estado = filtro.estado === v ? '' : v; render(); }));
  $('chatsList').replaceChildren(...chatsU.map(c => { const o = el('option'); o.value = c; return o; }));

  const q = filtro.q.toLowerCase();
  let vis = data.filter(e =>
    (!filtro.chat || e.chat === filtro.chat) &&
    (!filtro.tipo || e.tipo === filtro.tipo) &&
    (!filtro.estado || e.estado === filtro.estado) &&
    (!filtro.categoria || (e.categoria || 'Sin categoría') === filtro.categoria) &&
    (!q || [e.titulo, e.resumen, e.detalle, (e.tags||[]).join(' '), e.chat].join(' ').toLowerCase().includes(q))
  ).sort((a,b) => filtro.orden === 'cat'
    ? (a.categoria||'Sin categoría').localeCompare(b.categoria||'Sin categoría') || (b.fecha + b.id).localeCompare(a.fecha + a.id)
    : (a.fecha + a.id).localeCompare(b.fecha + b.id) * (filtro.orden === 'asc' ? 1 : -1));

  const st = $('stats'); st.replaceChildren();
  [['Entradas', data.length], ['Chats', chatsU.length], ['Abiertas', data.filter(e => e.estado === 'Abierto').length], ['Resueltas', data.filter(e => e.estado === 'Resuelto').length], ['Mostrando', vis.length]]
    .forEach(([k,v]) => { const s = el('span','stat', k + ' '); const b = el('b', null, v); s.append(b); st.append(s); });

  const L = $('lista'); L.replaceChildren();
  if (!vis.length){ L.append(el('div','empty','Sin entradas para este filtro.')); return; }
  let ultimaCat = null;
  vis.forEach(e => {
    if (filtro.orden === 'cat' && (e.categoria||'Sin categoría') !== ultimaCat){ ultimaCat = e.categoria||'Sin categoría'; L.append(el('h2','grupo', ultimaCat)); }
    const c = el('article','entry' + (e.estado === 'Abierto' ? ' open-state' : e.estado === 'Resuelto' ? ' resolved-state' : ''));
    const m = el('div','meta');
    m.append(el('span','badge t-'+e.tipo, e.tipo), el('span','badge',e.categoria||'Sin categoría'), el('span',null,e.fecha), el('span',null,'· '+e.chat), el('span','badge e-'+e.estado, (e.estado === 'Resuelto' ? '✓ ' : '') + e.estado));
    c.append(m, el('h3',null,e.titulo), el('p',null,e.resumen));
    if (e.detalle){ const d = el('details'); d.append(el('summary',null,'Ver detalle / código'), el('pre',null,e.detalle)); c.append(d); }
    if ((e.tags||[]).length){ const t = el('div','tags'); e.tags.forEach(x => t.append(el('span','tag','#'+x))); c.append(t); }
    const a = el('div','actions');
    const be = el('button',null,'Editar'); be.onclick = () => abrir(e);
    const bs = el('button',null, e.estado === 'Abierto' ? 'Marcar resuelto' : 'Reabrir');
    bs.onclick = () => { upsert({...e, estado: e.estado === 'Abierto' ? 'Resuelto' : 'Abierto'}); };
    const bd = el('button',null,'Borrar'); bd.onclick = () => { if (confirm('¿Borrar esta entrada?')) upsert({...e, _borrada:true}); };
    a.append(be, bs, bd); c.append(a);
    L.append(c);
  });
}

function upsert(e){
  const i = locales.findIndex(x => x.id === e.id);
  if (i >= 0) locales[i] = e; else locales.push(e);
  guardarLocal(); render();
}

function nuevoId(fecha){
  const n = todas().filter(e => e.fecha === fecha).length + 1;
  let id = fecha + '-' + String(n).padStart(3,'0');
  const usados = new Set([...base, ...locales].map(e => e.id));
  while (usados.has(id)) id = fecha + '-' + String(+id.slice(-3) + 1).padStart(3,'0');
  return id;
}

function abrir(e){
  editando = e || null;
  const f = $('form'); f.reset();
  $('dlgTitulo').textContent = e ? 'Editar entrada' : 'Nueva entrada';
  const v = e || {categoria: filtro.categoria, fecha: new Date().toISOString().slice(0,10), chat: filtro.chat, tipo:'Cambio', estado:'Hecho', tags:[]};
  ['chat','categoria','fecha','tipo','estado','titulo','resumen','detalle'].forEach(k => f.elements[k].value = v[k] || '');
  f.elements.tags.value = (v.tags||[]).join(', ');
  $('dlg').showModal();
}

$('form').addEventListener('submit', ev => {
  const f = ev.target.elements;
  const e = {
    id: editando ? editando.id : nuevoId(f.fecha.value),
    fecha: f.fecha.value, chat: f.chat.value.trim(), categoria: f.categoria.value.trim(), tipo: f.tipo.value, estado: f.estado.value,
    titulo: f.titulo.value.trim(), resumen: f.resumen.value.trim(), detalle: f.detalle.value,
    tags: f.tags.value.split(',').map(s => s.trim()).filter(Boolean)
  };
  upsert(e);
});
$('cancelar').onclick = () => $('dlg').close();
$('nuevo').onclick = () => abrir(null);
$('buscar').oninput = ev => { filtro.q = ev.target.value; render(); };
$('orden').onchange = ev => { filtro.orden = ev.target.value; render(); };

$('exportar').onclick = () => {
  const out = todas().sort((a,b) => (a.fecha+a.id).localeCompare(b.fecha+b.id));
  const blob = new Blob([JSON.stringify(out, null, 2)], {type:'application/json'});
  const a = el('a'); a.href = URL.createObjectURL(blob); a.download = 'entries.json'; a.click();
  URL.revokeObjectURL(a.href);
};
$('importar').onclick = () => $('archivo').click();
$('archivo').onchange = async ev => {
  const file = ev.target.files[0]; if (!file) return;
  try {
    const arr = JSON.parse(await file.text());
    if (!Array.isArray(arr)) throw 0;
    arr.forEach(e => { if (e && e.id && e.titulo) upsert(e); });
  } catch { alert('El archivo no es un JSON válido de entradas.'); }
  ev.target.value = '';
};

$('tema').onclick = () => {
  const r = document.documentElement;
  const dark = r.dataset.theme ? r.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme:dark)').matches;
  r.dataset.theme = dark ? 'light' : 'dark';
  try { localStorage.setItem('adolfo-log-theme', r.dataset.theme); } catch {}
};
try { const t = localStorage.getItem('adolfo-log-theme'); if (t) document.documentElement.dataset.theme = t; } catch {}


/* ---------- Visor de código ---------- */
const CFG = (() => {
  const m = location.hostname.match(/^(.+)\.github\.io$/);
  const repo = location.pathname.split('/')[1];
  return {owner: m ? m[1] : 'AdolfoA', repo: m && repo ? repo : 'log_job', branch: 'main', root: 'proyectos'};
})();
const cache = {
  get(k){ try { const v = JSON.parse(sessionStorage.getItem('gh:'+k)); if (v && Date.now() - v.t < 300000) return v.d; } catch {} return null; },
  set(k,d){ try { sessionStorage.setItem('gh:'+k, JSON.stringify({t:Date.now(), d})); } catch {} }
};
async function ghApi(path){
  const c = cache.get('api'+path); if (c) return c;
  const r = await fetch('https://api.github.com/repos/'+CFG.owner+'/'+CFG.repo+path, {headers:{Accept:'application/vnd.github+json'}});
  if (r.status === 403 || r.status === 429){
    const rs = r.headers.get('x-ratelimit-reset');
    throw new Error('Se alcanzó el límite de la API de GitHub' + (rs ? '; se restablece a las ' + new Date(rs*1000).toLocaleTimeString() : '') + '.');
  }
  if (!r.ok) throw new Error('GitHub respondió ' + r.status + '.');
  const d = await r.json(); cache.set('api'+path, d); return d;
}
async function rawFile(ref, path){
  const c = cache.get('raw'+ref+path); if (c !== null) return c;
  const r = await fetch('https://raw.githubusercontent.com/'+CFG.owner+'/'+CFG.repo+'/'+ref+'/'+path.split('/').map(encodeURIComponent).join('/'));
  if (!r.ok) throw new Error('No se pudo leer el archivo (' + r.status + ').');
  const t = await r.text(); cache.set('raw'+ref+path, t); return t;
}

const code = {tree:null, proyecto:'', archivo:'', commits:[], idx:0};
const msg = t => { const d = el('div','vmsg',t); $('vcode').replaceChildren(d); };

function diffLines(a, b){
  const n = a.length, m = b.length;
  const L = Array.from({length: n+1}, () => new Int32Array(m+1));
  for (let i = n-1; i >= 0; i--) for (let j = m-1; j >= 0; j--)
    L[i][j] = a[i] === b[j] ? L[i+1][j+1] + 1 : Math.max(L[i+1][j], L[i][j+1]);
  const out = []; let i = 0, j = 0;
  while (i < n && j < m){
    if (a[i] === b[j]){ out.push({k:'ctx', t:b[j]}); i++; j++; }
    else if (L[i+1][j] >= L[i][j+1]){ out.push({k:'del', t:a[i]}); i++; }
    else { out.push({k:'add', t:b[j]}); j++; }
  }
  while (i < n) out.push({k:'del', t:a[i++]});
  while (j < m) out.push({k:'add', t:b[j++]});
  return out;
}

async function cargarArbol(){
  if (code.tree) return;
  msg('Cargando proyectos…');
  try {
    const d = await ghApi('/git/trees/' + CFG.branch + '?recursive=1');
    const pre = CFG.root + '/';
    const map = {};
    d.tree.filter(x => x.type === 'blob' && x.path.startsWith(pre) && !x.path.endsWith('.gitkeep')).forEach(x => {
      const rest = x.path.slice(pre.length), i = rest.indexOf('/');
      if (i < 0) return;
      (map[rest.slice(0,i)] = map[rest.slice(0,i)] || []).push({full: x.path, rel: rest.slice(i+1), size: x.size});
    });
    code.tree = map;
    renderProyectos();
    const nombres = Object.keys(map).sort();
    if (!nombres.length){ msg('Aún no hay proyectos. Crea una carpeta dentro de "proyectos/" en el repo.'); return; }
    seleccionarProyecto(code.proyecto && map[code.proyecto] ? code.proyecto : nombres[0]);
  } catch (e) { msg(e.message); }
}
function renderProyectos(){
  const c = $('proyectos'); c.replaceChildren();
  Object.keys(code.tree).sort().forEach(n => {
    const ch = el('span','chip' + (code.proyecto === n ? ' on' : ''), n);
    ch.onclick = () => seleccionarProyecto(n);
    c.append(ch);
  });
}
function seleccionarProyecto(n){
  code.proyecto = n; code.archivo = ''; renderProyectos();
  $('vbar').hidden = true; $('vinfo').hidden = true;
  const L = $('archivos'); L.replaceChildren();
  const files = code.tree[n].slice().sort((a,b) => a.rel.localeCompare(b.rel));
  files.forEach(f => {
    const b = el('button','fbtn', f.rel); b.title = f.rel; b.dataset.full = f.full;
    b.onclick = () => abrirArchivo(f);
    L.append(b);
  });
  const first = files.find(f => /readme/i.test(f.rel)) || files[0];
  if (first) abrirArchivo(first); else msg('Esta carpeta está vacía.');
}
async function abrirArchivo(f){
  code.archivo = f.full;
  document.querySelectorAll('.fbtn').forEach(b => b.classList.toggle('on', b.dataset.full === f.full));
  msg('Cargando versiones…');
  try {
    code.commits = await ghApi('/commits?path=' + encodeURIComponent(f.full) + '&sha=' + CFG.branch + '&per_page=50');
    code.idx = 0; code.size = f.size;
    const sel = $('vversion'); sel.replaceChildren();
    const total = code.commits.length;
    code.commits.forEach((c, i) => {
      const o = el('option', null, 'v' + (total - i) + (i === 0 ? ' (actual)' : '') + ' · ' + c.commit.author.date.slice(0,10) + ' · ' + c.commit.message.split('\n')[0].slice(0,60) + ' · ' + c.sha.slice(0,7));
      o.value = i; sel.append(o);
    });
    $('vpath').textContent = f.full;
    $('vhist').href = 'https://github.com/'+CFG.owner+'/'+CFG.repo+'/commits/'+CFG.branch+'/'+f.full;
    $('vbar').hidden = false;
    await mostrarVersion();
  } catch (e) { msg(e.message); }
}
async function mostrarVersion(){
  const c = code.commits[code.idx]; if (!c) { msg('Este archivo no tiene historial.'); return; }
  $('vgh').href = 'https://github.com/'+CFG.owner+'/'+CFG.repo+'/blob/'+c.sha+'/'+code.archivo;
  if (code.size > 300000){ msg('Archivo muy grande para mostrarlo aquí. Ábrelo con "Ver en GitHub".'); return; }
  try {
    const text = await rawFile(c.sha, code.archivo);
    code.texto = text;
    const lines = text.replace(/\r\n/g,'\n').split('\n');
    if (lines.length && lines[lines.length-1] === '') lines.pop();
    const info = $('vinfo'); info.hidden = false;
    let ops;
    if ($('vdiff').checked){
      const prev = code.commits[code.idx+1];
      const pl = prev ? (await rawFile(prev.sha, code.archivo)).replace(/\r\n/g,'\n').split('\n') : [];
      if (pl.length && pl[pl.length-1] === '') pl.pop();
      if (pl.length * lines.length > 9e6){ msg('Archivo demasiado grande para comparar versiones.'); return; }
      ops = diffLines(pl, lines);
      const a = ops.filter(o => o.k === 'add').length, d = ops.filter(o => o.k === 'del').length;
      info.textContent = (prev ? 'Cambios frente a la versión anterior: ' : 'Primera versión: ') + '+' + a + ' / −' + d + ' líneas';
    } else {
      ops = lines.map(t => ({k:'ctx', t}));
      info.textContent = lines.length + ' líneas · ' + c.commit.author.name + ' · ' + c.commit.author.date.slice(0,10) + ' · ' + c.commit.message.split('\n')[0];
    }
    const frag = document.createDocumentFragment(); let n = 0;
    ops.forEach(o => {
      const row = el('div','cl ' + ($('vdiff').checked ? o.k : 'ctx'));
      if (o.k !== 'del') n++;
      row.append(el('span','ln', o.k === 'del' ? '' : n), el('span','tx', o.t));
      frag.append(row);
    });
    $('vcode').replaceChildren(frag);
  } catch (e) { msg(e.message); }
}
$('vversion').onchange = ev => { code.idx = +ev.target.value; mostrarVersion(); };
$('vdiff').onchange = mostrarVersion;
$('vcopiar').onclick = async ev => { try { await navigator.clipboard.writeText(code.texto || ''); ev.target.textContent = 'Copiado ✓'; setTimeout(() => ev.target.textContent = 'Copiar', 1500); } catch {} };

function vista(v){
  $('vistaLog').hidden = v !== 'log'; $('vistaCodigo').hidden = v !== 'codigo';
  $('tabLog').classList.toggle('on', v === 'log'); $('tabCodigo').classList.toggle('on', v === 'codigo');
  try { history.replaceState(null, '', v === 'codigo' ? '#codigo' : location.pathname + location.search); } catch {}
  if (v === 'codigo') cargarArbol();
}
$('tabLog').onclick = () => vista('log');
$('tabCodigo').onclick = () => vista('codigo');
if (location.hash === '#codigo') vista('codigo');

cargar();
</script>
